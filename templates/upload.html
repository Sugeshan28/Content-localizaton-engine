<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/upload.css') }}">
</head>
<body>

    <div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; flex-direction:column; justify-content:center; align-items:center; color:white;">
        <div style="font-size: 50px;">🤖</div>
        <h2 style="margin-top: 20px;">AI Processing in Progress...</h2>
        <p>Converting Video & Syncing Audio (This may take 2-5 mins)</p>
        <p style="font-size: 12px; color: #aaa;">Please do not close this window.</p>
    </div>

    <div class="modal">
        <div class="modal-header">
            <h2>SIH2025 - Upload Video</h2>
            <div style="cursor:pointer" onclick="window.location.href='/'">✕</div>
        </div>

        <form action="/upload" method="POST" enctype="multipart/form-data" id="uploadForm">
            
            <div class="modal-content">
                <div class="details-column">
                    <div class="input-group">
                        <label>Video File (Required)</label>
                        <div class="upload-zone main-video-upload" id="uploadZone">
                            <span style="font-size:24px;">📹</span>
                            <div id="file-label">Click to select video</div>
                            <input type="file" id="mainVideo" name="videoFile" accept="video/*" hidden required>
                        </div>
                    </div>

                    <div class="input-group">
                        <input type="text" class="input-box" name="title" placeholder="Video Title" required>
                    </div>

                    <div class="input-group">
                        <textarea class="input-box" name="description" placeholder="Description" rows="2"></textarea>
                    </div>

                    <div class="input-group">
                        <label>1. Original Video Language:</label>
                        <select name="sourceLanguage" class="input-box" style="margin-bottom: 15px;">
                            <option value="en">English</option>
                            <option value="ta">Tamil</option>
                            <option value="hi">Hindi</option>
                            <option value="hi">Kannada</option>
                        </select>

                        <label>2. Translate To (Select Multiple):</label>
                        <div style="display: flex; flex-wrap: wrap; gap: 15px; padding: 10px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px;">
                            <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                                <input type="checkbox" name="targetLanguages" value="ta" checked> Tamil
                            </label>
                            <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                                <input type="checkbox" name="targetLanguages" value="hi"> Hindi
                            </label>
                            <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                                <input type="checkbox" name="targetLanguages" value="kn"> Kannada
                            </label>
                            <label style="display:flex; align-items:center; gap:5px; cursor:pointer;">
                                <input type="checkbox" name="targetLanguages" value="ml"> Malayalam
                            </label>
                        </div>
                    </div>
                </div>

                <div class="preview-column">
                    <div class="preview-card">
                        <div class="video-placeholder">▶ Preview</div>
                        <div class="preview-info">
                            <p style="font-size:12px; color:#666;" id="filename-display">No file selected</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button type="submit" class="btn-primary" id="uploadBtn">🚀 Process Video</button>
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/upload.js') }}"></script>
</body>
</html>
