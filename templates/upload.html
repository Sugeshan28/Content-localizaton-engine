<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/upload.css') }}">
</head>
<body>

    <div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; flex-direction:column; justify-content:center; align-items:center; color:white;">
        <div style="font-size: 50px;">🤖</div>
        <h2>Processing Video...</h2>
        <p>This may take few minutes.</p>
    </div>

    <div class="modal">
        <div class="modal-header">
            <h2>SIH2025 Project</h2>
            <div style="cursor:pointer" onclick="window.location.href='/'">✕</div>
        </div>

        <form action="/upload" method="POST" enctype="multipart/form-data" id="uploadForm" style="display: contents;">
            
            <div class="modal-content">
                <div class="details-column">
                    <div class="input-group">
                        <label>Video File (Required)</label>
                        <div class="upload-zone main-video-upload" onclick="document.getElementById('mainVideo').click()">
                            <span style="font-size:24px;">📹</span>
                            <div>Click to select video</div>
                            <input type="file" id="mainVideo" name="videoFile" accept="video/*" hidden required>
                        </div>
                    </div>

                    <div class="input-group">
                        <input type="text" class="input-box" name="title" placeholder="Video Title" required>
                    </div>

                    <div class="input-group">
                        <textarea class="input-box" name="description" placeholder="Description" rows="3"></textarea>
                    </div>

                    <div class="input-group">
                        <label>Language Settings</label>
                        <div style="display:flex; gap:10px;">
                            <select name="sourceLanguage" required>
                                <option value="en">Original: English</option>
                                <option value="hi">Original: Hindi</option>
                            </select>
                            <select name="targetLanguage" required>
                                <option value="ta">Translate to: Tamil</option>
                                <option value="hi">Translate to: Hindi</option>
                                <option value="te">Translate to: Telugu</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="preview-column">
                    <div class="preview-card">
                        <div class="video-placeholder">▶ Preview</div>
                        <div class="preview-info">
                            <p style="font-size:12px; color:#666;" id="filename-display">No file selected</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <span id="statusText" style="font-size:13px; color:#666;">Waiting for file...</span>
                <button type="submit" class="btn-primary" id="uploadBtn">Upload Video</button>
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/upload.js') }}"></script>
</body>
</html>
