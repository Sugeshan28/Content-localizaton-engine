<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio - Upload Video</title>
    <link rel="stylesheet" href="/static/css/upload.css">
</head>
<body>

    <div class="modal">
        <!-- Header -->
        <div class="modal-header">
            <h2>SIH2025 Project</h2>
            <div class="stepper">
                <div class="step active">Details</div>
            </div>
            <div style="cursor:pointer">✕</div>
        </div>

        <form action="/upload" method="POST" enctype="multipart/form-data" style="display:contents">
            <div class="modal-content">
                <!-- Left: Inputs -->
                <div class="details-column">
                    <div class="header-row" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <h3 style="margin:0; font-size:24px;">Details</h3>
                        <span style="color:var(--accent-blue); font-size:13px; cursor:pointer;">REUSE DETAILS</span>
                    </div>

                    <!-- Main Video Upload Section -->
                    <div class="input-group">
                        <label style="font-size: 14px; color: var(--text-primary); margin-bottom: 8px;">Video File (Required)</label>
                        <div class="upload-zone main-video-upload" onclick="document.getElementById('mainVideo').click()">
                            <span style="font-size:24px; display:block; margin-bottom:5px;">📹</span>
                            <span style="font-size:14px; color:var(--text-primary); font-weight:bold;">Select Video to Upload</span>
                            <span style="font-size:12px; color:var(--text-secondary); display:block; margin-top:4px;">Drag and drop video files to upload</span>
                            <input type="file" id="mainVideo" name="videoFile" accept="video/*" hidden required>
                        </div>
                    </div>

                    <div class="input-group">
                        <input type="text" class="input-box" name="title" placeholder="Add a title that describes your video" required>
                        <label style="margin-top:5px; text-align:right;">0/100</label>
                    </div>

                    <div class="input-group">
                        <textarea class="input-box" name="description" placeholder="Tell viewers about your video"></textarea>
                    </div>


                    <!-- LANGUAGE SELECTION SECTION -->
                    <div class="form-group">
                        <label>🌐 Language Settings</label>
                        <div class="language-row">
                            <div>
                                <label>Video Language</label>
                                <select name="sourceLanguage" required>
                                    <option value="en">English</option>
                                    <option value="hi">Hindi</option>
                                    <!-- 11+ languages -->
                                </select>
                            </div>
                            <div>
                                <label>Target Language</label>
                                <select name="targetLanguage" required>
                                    <option value="ta">Tamil</option>
                                    <option value="hi">Hindi</option>
                                    <!-- 12+ languages -->
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <!-- LMS Specifics -->
                    <h3 class="section-title">LMS Processing</h3>
                    

                    <div class="input-group">
                        <label>Subtitles / Transcripts (SRT/VTT)</label>
                        <div class="upload-zone" onclick="document.getElementById('srtFile').click()">
                            <span style="font-size:24px; display:block; margin-bottom:5px;">📄</span>
                            <span style="font-size:13px; color:var(--text-secondary);">Select subtitle file</span>
                            <input type="file" id="srtFile" name="srtFile" hidden>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Translation Target Language</label>
                        <select class="input-box" name="language">
                            <option value="none">No Translation</option>
                            <option value="tamil">Tamil</option>
                            <option value="hindi">Hindi</option>
                            <option value="telugu">Telugu</option>
                        </select>
                    </div>

                    <h3 class="section-title">Assessment & Quiz</h3>
                    <div style="background-color:#1f1f1f; padding:15px; border-radius:4px;">
                        <div class="checkbox-row">
                            <input type="checkbox" id="genQuiz" name="genQuiz" checked>
                            <label for="genQuiz" style="margin:0; font-size:14px; color:var(--text-primary);">Auto-generate Quiz from content</label>
                        </div>
                        <div class="input-group" style="margin-top:15px;">
                            <label>Or upload manual assessment (PDF)</label>
                            <input type="file" name="assessmentFile" style="font-size:13px; color:var(--text-secondary);">
                        </div>
                    </div>
                </div>

                <!-- Right: Preview -->
                <div class="preview-column">
                    <div class="preview-card">
                        <div class="video-placeholder">
                            ▶ Video Preview
                        </div>
                        <div class="preview-info">
                            <div class="preview-label">Video Link</div>
                            <a href="#" class="preview-link">https://lms.co/v/pending...</a>
                            <div class="preview-label" style="margin-top:15px;">Filename</div>
                            <div style="font-size:13px;">waiting for upload...</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <div class="progress-status">
                    <span style="color:var(--text-secondary);">Waiting for selection...</span>
                </div>
                <button type="submit" class="btn btn-primary">Upload</button>
            </div>
        </form>
    </div>
<script>
    // 1. Select the elements
    const dropZone = document.querySelector('.main-video-upload');
    const fileInput = document.getElementById('mainVideo');
    const previewText = document.querySelector('.preview-info div:last-child');
    const statusText = document.querySelector('.progress-status span');

    // 2. Prevent default behavior (Stops browser from opening the file)
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    // 3. Add visual cues (Change border color when dragging)
    ['dragenter', 'dragover'].forEach(() => {
        dropZone.style.border = '2px dashed #4CAF50'; // Green border
        dropZone.style.backgroundColor = 'rgba(76, 175, 80, 0.1)';
    });

    ['dragleave', 'drop'].forEach(() => {
        dropZone.style.border = ''; // Revert to original
        dropZone.style.backgroundColor = '';
    });

    // 4. Handle the Drop Event
    dropZone.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;

        if (files.length > 0) {
            // CRITICAL STEP: Assign dropped file to the hidden input
            fileInput.files = files;

            // Update UI (Reuse the logic you already have)
            updateUI(files[0]);
        }
    }

    // 5. Handle Click Selection (Your existing logic)
    fileInput.addEventListener('change', function(e) {
        if (this.files[0]) {
            updateUI(this.files[0]);
        }
    });

    // Common function to update texts
    function updateUI(file) {
        // Right side preview
        previewText.innerText = file.name;
        previewText.style.color = "#4CAF50";
        
        // Bottom status
        statusText.innerText = "Ready to upload: " + file.name;
        
        // Left side upload box text
        document.querySelector('.main-video-upload span:nth-child(2)').innerText = "Selected: " + file.name;
    }
</script>
</body>
</html>
