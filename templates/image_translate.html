<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Visual Image Translator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/upload.css') }}">
    <style>
        .comparison-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .image-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 45%;
        }
        .image-card img {
            max-width: 100%;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="modal" style="position:relative; margin: 50px auto; max-width: 900px; transform: none;">
        <div class="modal-header">
            <h2>📷 Visual Image Translator</h2>
            <div style="cursor:pointer" onclick="window.location.href='/'">✕</div>
        </div>

        <form action="/image_translate" method="POST" enctype="multipart/form-data">
            <div class="modal-content">
                <div class="input-group">
                    <label>Upload Image (English Text)</label>
                    <div class="upload-zone" onclick="document.getElementById('imgInput').click()">
                        <span>🖼️</span>
                        <div>Click to select image</div>
                        <input type="file" id="imgInput" name="imageFile" accept="image/*" hidden required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="width:100%; margin-top:15px;">Translate Text in Image</button>
            </div>
        </form>

        {% if processed %}
        <div class="comparison-container">
            <div class="image-card">
                <h3>Original</h3>
                <img src="{{ url_for('serve_image', filename=original) }}">
            </div>
            <div class="image-card">
                <h3>Translated (Tamil)</h3>
                <img src="{{ url_for('serve_image', filename=processed) }}">
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
