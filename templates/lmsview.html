<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{{ video.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/lmsview.css') }}" />
  <link href="[https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap)" rel="stylesheet" />
</head>
<body>
    <div class="app-shell">
    
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-circle">L</div>
            <div class="logo-text"><h1>{{ t('sidebar_title') }}</h1></div>
        </div>
        <div class="sidebar-section">
            <h2 class="sidebar-title">{{ t('profile_header') }}</h2>
             <div class="profile-card">
                <div class="avatar-circle">S</div>
                <div class="profile-info"><p class="profile-name">Student</p></div>
             </div>
        </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <h2 class="page-title">{{ video.title }}</h2>
        </div>
        <div class="topbar-right">
            <select onchange="window.location.href='/set_language/'+this.value" class="pill-select">
                <option value="en" {% if current_lang == 'en' %}selected{% endif %}>English</option>
                <option value="ta" {% if current_lang == 'ta' %}selected{% endif %}>Tamil</option>
                <option value="hi" {% if current_lang == 'hi' %}selected{% endif %}>Hindi</option>
                <option value="te" {% if current_lang == 'te' %}selected{% endif %}>Telugu</option>
                <option value="kn" {% if current_lang == 'kn' %}selected{% endif %}>Kannada</option>
            </select>
        </div>
      </header>

      <section class="content-layout">
        <div class="video-and-controls">
          <div class="video-card">
            <div class="video-wrapper">
              <video id="mainVideoPlayer" class="lesson-video" controls>
                  <source src="{{ url_for('serve_video', filename=video.original_filename) }}" type="video/mp4">
                  Your browser does not support the video tag.
              </video>
              
              <!-- Hidden Audio Player for Dubbing -->
              <audio id="dubbedAudio" style="display:none;">
                  <source src="" type="audio/wav">
              </audio>
            </div>
            
            <div class="video-meta">
              <p class="video-title">{{ video.title }}</p>
              <p class="video-subtitle">{{ video.description }}</p>
            </div>

            <div style="margin-top: 20px; padding: 20px; background: #f0f7ff; border-radius: 12px; border: 1px solid #d2e3f5;">
                <h3 style="margin:0 0 10px 0;">🎧 {{ t('trans_audio_title') }}</h3>
                
                <div style="display:flex; gap:10px; align-items:center;">
                    <label>{{ t('choose_audio_label') }}</label>
                    
                    <!-- Populated by JS -->
                    <select id="audioSelector" style="padding:8px; border-radius:6px; min-width: 150px;">
                        <option value="original">Original Audio</option>
                    </select>
                </div>
                <p style="font-size:12px; color:#666; margin-top:5px;">* Audio will sync automatically with the video.</p>
            </div>
          </div>
        </div>

        <div class="info-card">
          <div class="tabs">
            <button class="tab-button active">{{ t('tab_desc') }}</button>
          </div>
          <div class="tab-panels">
            <div class="tab-panel active">
              <h3>Transcript</h3>
              <p id="dynamicText" style="white-space: pre-wrap; line-height: 1.6;">{{ video.description }}</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- THE BRIDGE: Pass Python Data to JavaScript Safely -->
  <script>
      // NOTE: We do NOT use quotes here. content_map is already a JSON string.
      // This creates a valid JS Object.
      window.VIDEO_CONTENT_MAP = {{ content_map | safe }};
      
      // Use backticks for description to handle multi-line strings
      window.ORIGINAL_DESCRIPTION = `{{ video.description }}`;
  </script>

  <!-- External JS File -->
  <script src="{{ url_for('static', filename='js/lmsview.js') }}"></script>
</body>
</html>
